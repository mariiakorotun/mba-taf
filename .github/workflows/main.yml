name: MBA Test Automation

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 4 * * 1-5" 
  workflow_dispatch:
    inputs:
      env:
        description: "Середовище"
        type: choice
        options: [ dev, staging, prod ]
        default: dev
      groups:
        description: "Теги тестів (TestNG groups)"
        type: choice
        options: [ regression, smoke, gui, api, security, known-defect ]
        default: regression
      threads:
        description: "Кількість паралельних потоків"
        default: "2"

env:
  TAF_ENV: ${{ inputs.env || 'dev' }}
  TAF_GROUPS: ${{ inputs.groups || 'regression' }}
  TAF_THREADS: ${{ inputs.threads || '2' }}

# проєкт TAF лежить у підпапці mba-taf/
defaults:
  run:
    working-directory: mba-taf

jobs:
  test:
    name: "${{ matrix.browser }} | ${{ inputs.env || 'dev' }} | ${{ inputs.groups || 'regression' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]   # паралелізація на рівні job: кожен браузер на окремій ВМ

    steps:
      - name: Checkout TAF
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Checkout SUT (dev only)
        if: env.TAF_ENV == 'dev'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SUT_REPOSITORY }}
          token: ${{ secrets.SUT_REPO_TOKEN }}
          path: sut

      - name: Build and start SUT with H2 (dev only)
        if: env.TAF_ENV == 'dev'
        working-directory: sut
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/mini-banking-app-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=local \
            --spring.datasource.url="jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1" \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.cloud.azure.storage.blob.enabled=false \
            > "$GITHUB_WORKSPACE/sut.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/login > /dev/null; then echo "SUT is up"; exit 0; fi
            sleep 2
          done
          echo "SUT did not start"; tail -n 100 "$GITHUB_WORKSPACE/sut.log"; exit 1

      - name: Run tests
        run: >
          mvn -B test
          -Denv=${{ env.TAF_ENV }}
          -Dbrowser=${{ matrix.browser }}
          -Dgroups=${{ env.TAF_GROUPS }}
          -Dthreads=${{ env.TAF_THREADS }}
          ${{ env.TAF_GROUPS == 'known-defect' && '-DexcludedGroups=none' || '' }}
          -Dheadless=true
        env:
          MBA_USER_PASSWORD: ${{ secrets.MBA_USER_PASSWORD }}
          MBA_ADMIN_PASSWORD: ${{ secrets.MBA_ADMIN_PASSWORD }}

      - name: Generate Allure report
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:2.15.2:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}-${{ env.TAF_ENV }}
          path: mba-taf/target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.browser }}-${{ env.TAF_ENV }}
          path: |
            mba-taf/target/logs/
            mba-taf/target/surefire-reports/
            sut.log
          if-no-files-found: ignore
